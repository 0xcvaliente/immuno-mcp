[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "immuno-mcp"
version = "0.1.0"
description = "MCP server for immunology, bioengineering and computational antibody design"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
keywords = ["mcp", "antibody", "nanobody", "vhh", "immunology", "bioinformatics", "protein-design"]
classifiers = [
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "mcp>=2.3,<3",
    "httpx>=0.28,<1",
    "pydantic>=2.11,<3",
    "biotite>=2.0,<3",
]

[project.optional-dependencies]
# Antibody numbering with ANARCII (pulls in PyTorch, roughly 700 MB).
numbering = ["anarcii>=2.0.8"]
# Local dataset index for OAS-style bulk data.
data = ["duckdb>=2.0"]

[project.scripts]
immuno-mcp = "immuno_mcp.server:main"

[dependency-groups]
dev = [
    "pytest>=9",
    "pytest-asyncio>=1.5",
    "respx>=0.23",
    "ruff>=0.17",
    "mypy>=2.4",
]

[tool.hatch.build.targets.wheel]
packages = ["src/immuno_mcp"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "docs", "skills", "README.md", "LICENSE", "pyproject.toml"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-ra -m 'not live'"
markers = [
    "live: calls real network endpoints; run with `pytest -m live`",
    "slow: loads a large model or downloads data",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "SIM", "RUF"]
# Scientific text legitimately contains Greek letters and Angstrom signs.
# E501: the formatter wraps code; long SQL, URLs and protein sequences are fine.
ignore = ["E501", "RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
warn_unused_ignores = true
ignore_missing_imports = true
