# Fast-forwards the Mac copy of this repository
# ($HOME/Documents/projects-repo/immuno-mcp) to origin/main, then runs
# uv sync --frozen only when pyproject.toml or uv.lock changed since the last
# successful sync (recorded in .venv/.synced-from). Runs on the self-hosted
# runner on the Mac (label mac-sync).
# It never discards local work: it stops with an error when the copy is not on
# main or has uncommitted tracked changes, and it only fast-forwards.
name: Update Mac copy

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Daily catch-up for when the Mac was offline during a push.
    - cron: "29 6 * * *"

permissions:
  contents: read

concurrency:
  group: update-mac-copy
  cancel-in-progress: false

jobs:
  update:
    runs-on: [self-hosted, mac-sync]
    timeout-minutes: 20
    steps:
      # No actions/checkout: that would act on the runner's work dir, not the clone.
      - name: Fast-forward Mac clone
        id: ff
        shell: bash
        env:
          # The schedule payload has no repository object, so fall back to GITHUB_REPOSITORY.
          REPO_NAME: ${{ github.event.repository.name }}
          JOB_TOKEN: ${{ github.token }}
          GIT_TERMINAL_PROMPT: "0"
        run: |
          set -euo pipefail
          name="${REPO_NAME:-${GITHUB_REPOSITORY#*/}}"
          if [[ ! "$name" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo "::error::Unexpected repository name '$name'"
            exit 1
          fi
          cd "$HOME/Documents/projects-repo/$name"

          branch="$(git symbolic-ref --quiet --short HEAD || echo '(detached HEAD)')"
          if [[ "$branch" != "main" ]]; then
            echo "::error::Mac copy is on '$branch', not main. Not updating."
            exit 1
          fi
          changes="$(git status --porcelain --untracked-files=no)"
          if [[ -n "$changes" ]]; then
            echo "::error::Mac copy has uncommitted tracked changes. Not updating:"
            echo "$changes"
            exit 1
          fi

          before="$(git rev-parse HEAD)"
          # GitHub's git endpoint rejects bearer auth for the job token; use basic
          # x-access-token auth, as actions/checkout does. Not stored in git config.
          auth="$(printf 'x-access-token:%s' "$JOB_TOKEN" | base64 | tr -d '\n')"
          echo "::add-mask::$auth"
          git -c http.extraheader="AUTHORIZATION: basic ${auth}" fetch origin main
          if ! git merge --ff-only origin/main; then
            echo "::error::Mac copy cannot be fast-forwarded to origin/main (local commits?). Not updating."
            exit 1
          fi
          after="$(git rev-parse HEAD)"
          echo "before: $before"
          echo "after:  $after"
          git log -1 --oneline
          if [[ "$before" != "$after" ]]; then changed=true; else changed=false; fi
          {
            echo "before=$before"
            echo "after=$after"
            echo "changed=$changed"
          } >> "$GITHUB_OUTPUT"
          echo "HEAD changed: $changed"

      - name: Sync .venv when dependencies changed
        shell: bash
        run: |
          set -euo pipefail
          cd "$HOME/Documents/projects-repo/immuno-mcp"
          uv=/opt/homebrew/bin/uv
          # The Mac venv carries both extras (numbering, data) and the dev group,
          # so sync with --all-extras: a plain sync would uninstall ANARCII and torch.
          # Never --reinstall, never delete .venv.
          sync_args=(sync --frozen --all-extras)
          hash="$(cat pyproject.toml uv.lock | shasum -a 256 | cut -d' ' -f1)"
          marker=.venv/.synced-from
          need=false
          if [[ ! -d .venv ]]; then
            echo ".venv is missing; syncing"
            need=true
          elif [[ -f "$marker" ]]; then
            if [[ "$(cat "$marker")" != "$hash" ]]; then
              echo "$marker differs from pyproject.toml + uv.lock hash $hash; syncing"
              need=true
            fi
          else
            echo "$marker missing; checking with a dry run"
            dry="$("$uv" "${sync_args[@]}" --dry-run 2>&1)"
            echo "$dry"
            if grep -qE '^ [-+] |Would (un)?install' <<<"$dry"; then
              need=true
            fi
          fi
          if [[ "$need" == false ]]; then
            echo "dependencies unchanged; no sync"
            [[ -f "$marker" ]] || printf '%s\n' "$hash" > "$marker"
            exit 0
          fi
          if ! "$uv" "${sync_args[@]}"; then
            echo "::error::uv sync --frozen failed; .venv/.synced-from not updated"
            exit 1
          fi
          printf '%s\n' "$hash" > "$marker"
          echo "Sync succeeded; wrote $marker = $hash"
          echo "::notice::immuno-mcp dependencies were synced. Restart the immuno MCP server (or the Claude session using it) to load them."
